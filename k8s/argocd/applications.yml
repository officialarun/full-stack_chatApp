# Argo CD Application manifest for development
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatapp-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/officialarun/full-stack_chatApp.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: chatapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# Argo CD Application manifest for production
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatapp-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/officialarun/full-stack_chatApp.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: chatapp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Production: manual sync only
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
