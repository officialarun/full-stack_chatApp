# Dev Environment Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chatapp
resources:
  - ../base

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1
  - name: mongodb
    count: 1

namePrefix: dev-

images:
  - name: dockerhub0600/chatapp-backend
    newTag: latest
  - name: dockerhub0600/chatapp-frontend
    newTag: latest

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
    spec:
      template:
        spec:
          containers:
          - name: backend
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      template:
        spec:
          containers:
          - name: frontend
            resources:
              requests:
                memory: "32Mi"
                cpu: "25m"
              limits:
                memory: "128Mi"
                cpu: "100m"

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
  - name: frontend-config
    behavior: merge
    literals:
      - VITE_API_URL=http://localhost:5001/api
      - NODE_ENV=development
