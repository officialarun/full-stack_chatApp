apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      name: mongodb-pod
      namespace:  chat-app
      labels:
        app: mongodb
    spec:
      containers:
        - name: chatapp-mongodb-container
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD  
              value: "production" 
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongodb-pvc