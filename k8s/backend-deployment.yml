apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: chatapp-backend-container
          image: dockerhub0600/chatapp-backend:latest
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              value: "production" 
            - name: MONGODB_URI
              # use the same user/password as set by the mongo init env vars in mongodb-deployment.yml
              # initial root user is created as `admin` with password `production` there
              value: "mongodb://admin:production@mongodb:27017/dbname?authSource=admin"
            - name: PORT
              value: "5001"
            - name: JWT_SECRET
              valueFrom: 
                secretKeyRef:
                  name: fullstack-chatapp-secret
                  key: JWT_SECRET